name: radio image

on:
  push:
    branches: [master]
    paths:
      - main.go
      - stage_linux.go
      - catalog_linux.go
      - stage_other.go
      - catalog_other.go
      - go.mod
      - player/**
      - Dockerfile
      - chart/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: radio-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/decisionpreneur/radio:${{ github.sha }}
            ghcr.io/decisionpreneur/radio:master
