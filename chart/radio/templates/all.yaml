apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radio-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radio-tuna
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: radio-tuna}
  template:
    metadata:
      labels: {app: radio-tuna}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tuna
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nice", "-n", "19", "/usr/local/bin/radio", "serve"]
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: DATA_PATH, value: "/data/radio.db"}
            - {name: PLAYLIST_PATH, value: "/data/playlists.db"}
            - {name: MISSING_DROPBOX_PATH, value: "/audio/missing.yml"}
            - {name: PUBLIC_URL, value: {{ .Values.publicURL | quote }}}
            - {name: DROPBOX_ROOT, value: {{ .Values.dropboxRoot | quote }}}
            - {name: GOMAXPROCS, value: "1"}
            - {name: GOMEMLIMIT, value: "768MiB"}
            - name: TUNA_DROPBOX_APP_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.tuna }}, key: app-key}}
            - name: TUNA_DROPBOX_APP_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.tuna }}, key: app-secret}}
            - name: DROPBOX_ALLOWED_ACCOUNT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.tuna }}, key: allowed-account-id}}
            - name: INDEXER_DROPBOX_APP_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.indexer }}, key: app-key}}
            - name: INDEXER_DROPBOX_APP_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.indexer }}, key: app-secret}}
            - name: INDEXER_DROPBOX_REFRESH_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.indexer }}, key: refresh-token}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 2, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 30}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
        {{- if .Values.cloudflareTunnel.enabled }}
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--no-autoupdate", "run", "--token", "$(TUNNEL_TOKEN)"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.cloudflareTunnel.secretName }}, key: token}}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: radio-data}
---
apiVersion: v1
kind: Service
metadata:
  name: radio-tuna
spec:
  selector: {app: radio-tuna}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
