<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1ed760">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Vandrowka Radio</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0d;--panel:#111319;--panel2:#181b23;--text:#f5f5f7;--muted:#9297a3;--line:#292d38;--accent:#1ed760;--accent2:#79f2a3;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{color:inherit}.shell{min-height:100%;display:grid;grid-template-columns:230px 1fr;grid-template-rows:1fr 94px}.side{padding:28px 18px;border-right:1px solid var(--line);background:#0c0d11}.brand{display:flex;align-items:center;gap:11px;margin:0 10px 30px;font-size:1.08rem}.mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#061108;font-weight:900}.nav{display:grid;gap:5px}.nav button{width:100%;padding:11px 12px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--muted);font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{min-width:0;padding:24px 28px 130px;background:radial-gradient(circle at 70% 0,#173223 0,transparent 34%),var(--bg)}.top{display:flex;align-items:center;gap:14px}.search{flex:1;max-width:720px;height:46px;border:1px solid var(--line);border-radius:24px;padding:0 18px;background:var(--panel);color:var(--text);outline:0}.search:focus{border-color:var(--accent)}.actions{margin-left:auto;display:flex;gap:8px}.auth{border:1px solid var(--line);border-radius:24px;padding:10px 15px;background:var(--panel);cursor:pointer;text-decoration:none;color:var(--text)}.hero{padding:54px 0 30px}.hero p{margin:0;color:var(--accent2);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem}.hero h1{margin:8px 0 5px;font-size:clamp(2rem,5vw,4.6rem);line-height:.96;letter-spacing:-.055em}.hero small{color:var(--muted)}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:20px 0 12px}.sectionHead h2{margin:0;font-size:1.1rem}.sectionHead output{color:var(--muted)}.tracks{display:grid;gap:2px}.track{display:grid;grid-template-columns:44px minmax(160px,1.5fr) minmax(140px,1fr) minmax(120px,.8fr) 58px;gap:13px;align-items:center;padding:8px 10px;border:0;border-radius:7px;background:transparent;text-align:left;cursor:pointer}.track:hover,.track.playing{background:var(--panel2)}.track.missing{cursor:default;opacity:.65}.cover{width:42px;height:42px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(135deg,#244d34,#18222f);font-weight:900;color:var(--accent2)}.primary,.secondary{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.primary b{display:block}.primary span,.secondary,.time{color:var(--muted);font-size:.86rem}.time{text-align:right}.empty{padding:60px 20px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}.login{max-width:540px;margin:16vh auto;padding:44px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center}.login h1{font-size:2.4rem;margin:14px 0}.login p{color:var(--muted)}.connect{display:inline-flex;margin-top:14px;padding:13px 22px;border-radius:24px;background:var(--accent);color:#061108;text-decoration:none;font-weight:900}.player{position:fixed;z-index:3;left:0;right:0;bottom:0;height:94px;display:grid;grid-template-columns:minmax(180px,1fr) minmax(280px,1.4fr) minmax(120px,1fr);align-items:center;gap:20px;padding:13px 22px;border-top:1px solid var(--line);background:rgba(15,17,22,.97);backdrop-filter:blur(18px)}.now{display:flex;align-items:center;gap:12px;min-width:0}.nowText{min-width:0}.nowText b,.nowText span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowText span{color:var(--muted);font-size:.84rem}.controls{display:flex;justify-content:center;align-items:center;gap:14px}.play{width:44px;height:44px;border:0;border-radius:50%;background:var(--text);color:#08090b;font-size:1.1rem;cursor:pointer}.ghost{border:0;background:transparent;color:var(--muted);cursor:pointer}.ghost:hover{color:var(--text)}audio{width:100%;height:38px}.hidden{display:none!important}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2;display:flex;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line)}.brand{margin:0 16px 0 0}.nav{display:flex;overflow:auto}.nav button{width:auto}.main{padding:18px 16px 120px}.track{grid-template-columns:44px minmax(0,1fr) 55px}.track>.secondary{display:none}.player{grid-template-columns:1fr 1.2fr;height:100px;padding:10px 14px}.player audio{display:none}.hero{padding-top:38px}}@media(max-width:520px){.brand span:last-child{display:none}.nav button{padding-inline:9px}.actions .auth{font-size:.78rem;padding:9px}.track{padding-inline:4px}.player{grid-template-columns:minmax(0,1fr) auto}.controls{justify-content:flex-end}.ghost{display:none}}
  </style>
</head>
<body>
  <section id="login" class="login hidden"><div class="mark" style="margin:auto">V</div><h1>Your phonoteca</h1><p>Stream the collection stored in your Dropbox.</p><a class="connect" href="/auth/dropbox">Connect Dropbox</a></section>
  <div id="app" class="shell hidden">
    <aside class="side"><h1 class="brand"><span class="mark">V</span><span>Vandrowka Radio</span></h1><nav class="nav"><button class="active" data-view="songs">Songs</button><button data-view="albums">Albums</button><button data-view="artists">Artists</button><button data-view="playlists">Playlists</button></nav></aside>
    <main class="main"><header class="top"><input id="search" class="search" type="search" placeholder="Search your phonoteca" autocomplete="off"><div class="actions"><button id="install" class="auth hidden" type="button">Install</button><a class="auth" href="/auth/logout">Disconnect</a></div></header><section class="hero"><p>Dropbox library</p><h1 id="heading">Songs</h1><small id="subheading">Full indexed catalogue</small></section><div class="sectionHead"><h2 id="sectionTitle">Tracks</h2><output id="count"></output></div><section id="tracks" class="tracks"></section></main>
    <footer class="player"><div class="now"><div id="nowCover" class="cover">V</div><div class="nowText"><b id="nowTitle">Select a track</b><span id="nowArtist">Dropbox</span></div></div><div class="controls"><button id="previous" class="ghost" aria-label="Previous">◀</button><button id="play" class="play" aria-label="Play">▶</button><button id="next" class="ghost" aria-label="Next">▶▶</button></div><audio id="audio" controls preload="none"></audio></footer>
  </div>
  <script>
    const state={tracks:[],folders:[],filtered:[],view:'songs',folder:null,playlist:null,current:-1};const $=s=>document.querySelector(s);const login=$('#login'),app=$('#app'),list=$('#tracks'),audio=$('#audio');
    let installPrompt=null;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;$('#install').classList.remove('hidden')});window.addEventListener('appinstalled',()=>{$('#install').classList.add('hidden');installPrompt=null});$('#install').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install').classList.add('hidden')});
    boot();
    async function boot(){const me=await fetch('/api/me');if(me.status===401){login.classList.remove('hidden');return}if(!me.ok){login.classList.remove('hidden');return}app.classList.remove('hidden');const trackResponse=await fetch('/api/tracks');state.tracks=trackResponse.ok?await trackResponse.json():[];const playlistResponse=await fetch('/api/playlists');state.folders=playlistResponse.ok?await playlistResponse.json():[];render()}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(item=>item.classList.remove('active'));button.classList.add('active');state.view=button.dataset.view;state.folder=null;state.playlist=null;render()}));
    $('#search').addEventListener('input',render);$('#play').addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#previous').addEventListener('click',()=>select(Math.max(0,state.current-1)));$('#next').addEventListener('click',()=>select(Math.min(state.filtered.length-1,state.current+1)));audio.addEventListener('play',()=>$('#play').textContent='Ⅱ');audio.addEventListener('pause',()=>$('#play').textContent='▶');audio.addEventListener('ended',()=>select(Math.min(state.filtered.length-1,state.current+1)));
    function render(){const query=$('#search').value.trim().toLowerCase();list.textContent='';if(state.view==='playlists'){renderPlaylists(query);return}state.filtered=state.tracks.filter(t=>[t.title,t.artist,t.album,t.name].join(' ').toLowerCase().includes(query));const title=state.view[0].toUpperCase()+state.view.slice(1);$('#heading').textContent=title;$('#sectionTitle').textContent=title;$('#count').textContent=`${state.filtered.length.toLocaleString()} ${state.view}`;if(!state.filtered.length){list.innerHTML='<div class="empty">The indexed catalogue is empty.</div>';return}if(state.view==='songs'){state.filtered.forEach((t,i)=>list.append(trackRow(t,i)));return}const key=state.view==='albums'?'album':'artist';const groups=new Map();state.filtered.forEach(t=>{const name=t[key]||(key==='artist'?'?':'N/A');if(!groups.has(name))groups.set(name,[]);groups.get(name).push(t)});state.filtered=[];for(const [name,items] of groups){const first=items[0];const row=trackRow({...first,title:name,artist:`${items.length} tracks`,album:first.artist},state.filtered.length);row.addEventListener('click',event=>{event.stopImmediatePropagation();state.view='songs';state.filtered=items;select(0)});list.append(row);state.filtered.push(...items)}}
    function renderPlaylists(query){if(state.playlist){const items=state.playlist.items.filter(item=>[item.track,item.artist,item.album].join(' ').toLowerCase().includes(query));state.filtered=items.map(item=>({id:item.trackId,title:item.track,artist:item.artist,album:item.album,missing:!item.trackId}));$('#heading').textContent=state.playlist.name;$('#sectionTitle').textContent=state.folder.source;$('#count').textContent=`${state.filtered.length.toLocaleString()} tracks`;state.filtered.forEach((t,i)=>list.append(trackRow(t,i)));return}if(state.folder){const playlists=state.folder.playlists.filter(item=>item.name.toLowerCase().includes(query));$('#heading').textContent=state.folder.source;$('#sectionTitle').textContent='Playlists';$('#count').textContent=`${playlists.length.toLocaleString()} playlists`;for(const playlist of playlists){const row=trackRow({id:state.folder.source+'\0'+playlist.uri,title:playlist.name,artist:state.folder.source,album:`${playlist.itemCount} tracks`,card:true},0);row.addEventListener('click',async()=>{const response=await fetch(`/api/playlists/items?source=${encodeURIComponent(state.folder.source)}&uri=${encodeURIComponent(playlist.uri)}`);if(response.ok){state.playlist=await response.json();render()}});list.append(row)}return}const folders=state.folders.filter(item=>item.source.toLowerCase().includes(query));$('#heading').textContent='Playlists';$('#sectionTitle').textContent='Sources of playlists';$('#count').textContent=`${folders.length.toLocaleString()} folders`;for(const folder of folders){const row=trackRow({id:folder.source,title:folder.source,artist:'Playlist source',album:`${folder.playlists.length} playlists`,card:true},0);row.addEventListener('click',()=>{state.folder=folder;render()});list.append(row)}}
    function trackRow(t,index){const row=document.createElement('button');row.className='track'+(t.missing?' missing':'');row.type='button';row.dataset.id=t.id;row.innerHTML=`<span class="cover">${escape((t.artist||t.title||'V').slice(0,1).toUpperCase())}</span><span class="primary"><b>${escape(t.title||t.name)}</b><span>${escape(t.artist||'?')}</span></span><span class="secondary">${escape(t.album||'')}</span><span class="secondary">${escape(t.missing?'Missing':'')}</span><span class="time">${duration(t.duration)}</span>`;if(!t.missing&&!t.card)row.addEventListener('click',()=>select(index));return row}
    function select(index){if(index<0||index>=state.filtered.length)return;state.current=index;const t=state.filtered[index];if(!t.id)return;document.querySelectorAll('.track').forEach(row=>row.classList.toggle('playing',row.dataset.id===t.id));$('#nowTitle').textContent=t.title||t.name;$('#nowArtist').textContent=t.artist||'?';$('#nowCover').textContent=(t.artist||t.title||'V').slice(0,1).toUpperCase();audio.src='/api/stream/'+encodeURIComponent(t.id);audio.play()}
    function duration(seconds){if(!seconds)return'';const minutes=Math.floor(seconds/60);return `${minutes}:${String(Math.floor(seconds%60)).padStart(2,'0')}`}
    function escape(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
  </script>
</body>
</html>
