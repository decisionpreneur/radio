<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>Radio</h1>
          <p id="status">stopped</p>
        </div>
        <div class="actions">
          <button id="startBtn" type="button">Start</button>
          <button id="stopBtn" type="button">Stop</button>
          <button id="randomBtn" type="button">Randomize</button>
          <button id="midiBtn" type="button">MIDI</button>
          <button id="exportBtn" type="button">Export</button>
          <a id="donateLink" href="#" data-donation-url="">Donate</a>
        </div>
      </section>

      <section class="layout">
        <form id="controls" class="panel">
          <label>
            Seed
            <input id="seed" name="seed" value="radio-live">
          </label>
          <label>
            Base BPM
            <input id="baseBpm" name="baseBpm" type="number" min="20" max="300" value="127">
          </label>
          <label>
            Base meter
            <input id="baseMeter" name="baseMeter" type="number" min="1" max="64" value="1">
          </label>
          <label>
            Patterns
            <input id="patternCount" name="patternCount" type="number" min="2" max="64" value="20">
          </label>
          <label>
            Start-only
            <input id="startOnlyCount" name="startOnlyCount" type="number" min="0" max="64" value="4">
          </label>
          <label>
            Pulses
            <input id="pulseCount" name="pulseCount" type="number" min="0" max="64" value="5">
          </label>
          <label>
            First number
            <input id="meterStart" name="meterStart" type="number" min="1" max="64" value="1">
          </label>
          <label>
            Cycle length
            <input id="cycleLength" name="cycleLength" type="number" min="1" max="4096" value="3">
          </label>
          <label>
            Cycle unit
            <select id="cycleLengthKind" name="cycleLengthKind">
              <option value="resolving-sequences">resolving sequences</option>
              <option value="bars">bars</option>
            </select>
          </label>
          <label>
            Basis
            <select id="basisPolicy" name="basisPolicy">
              <option value="next">next</option>
              <option value="random">random</option>
              <option value="closest">closest</option>
              <option value="farthest">farthest</option>
            </select>
          </label>
          <label>
            Meter timing
            <select id="meterTiming" name="meterTiming">
              <option value="shared-bar-polyrhythm">shared-bar-polyrhythm</option>
              <option value="same-pulse-polymeter">same-pulse-polymeter</option>
            </select>
          </label>
          <label>
            Strong beat
            <select id="strongBeatMode" name="strongBeatMode">
              <option value="every-beat">every beat</option>
              <option value="downbeat-only">downbeat only</option>
            </select>
          </label>
          <label>
            Replacement
            <select id="replacementCadence" name="replacementCadence">
              <option value="immediate">immediate</option>
              <option value="one-per-bar">one per bar</option>
              <option value="one-per-resolving-sequence">one per resolving sequence</option>
            </select>
          </label>
          <label>
            Export sections
            <input id="exportSections" name="exportSections" type="number" min="1" max="64" value="6">
          </label>
          <label>
            MIDI output
            <select id="midiOutput" name="midiOutput">
              <option value="">none</option>
            </select>
          </label>
        </form>

        <section class="work">
          <canvas id="timeline" width="1280" height="420"></canvas>
          <div id="voices" class="voices"></div>
        </section>
      </section>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
